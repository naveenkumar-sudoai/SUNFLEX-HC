; SUNFLEX-HC Firmware — PlatformIO Configuration
; ESP32-S3 with Arduino framework
; https://platformio.org/

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = inc

; ---------------------------------------------------------------------------
; ESP32-S3 Target (default)
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Upload settings
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = direct

; Flash size: 16 MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions_custom.csv

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFPPT_SOH_DERATE_EXPONENT=1.5
    -DCHARGE_CURRENT_MAX_A=20.0

; Libraries
lib_deps =
    ; MQTT
    knolleary/PubSubClient@^2.8
    ; Web Server
    ; (ESP32 native WiFi + AsyncTCP)
    me-no-dev/AsyncTCP@^3.1.0
    me-no-dev/ESPAsyncWebServer@^2.0.0
    ; JSON
    bblanchon/ArduinoJson@^7.0.0
    ; I2C/SPI utilities
    ; (Wire and SPI built into framework)

; Debugging
debug_tool = esp-builtin
debug_init_break = tbreak setup

; ---------------------------------------------------------------------------
; Native (Unit Tests)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Isrc
    -Iinc
    -DTESTING

; ---------------------------------------------------------------------------
; Custom partition table
; ---------------------------------------------------------------------------
; partitions_custom.csv:
; # Name,   Type, SubType, Offset,  Size,    Flags
; nvs,      data, nvs,     0x9000,  0x6000,
; otadata,  data, ota,     0xF000,  0x2000,
; app0,     app,  ota_0,   0x10000, 0x300000,
; app1,     app,  ota_1,   0x310000,0x300000,
; spiffs,   data, spiffs,  0x610000,0x200000,
; fpga,     data, 0x40,    0x810000,0x80000,
